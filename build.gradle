plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.gradleup.shadow' version '9.3.2'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url = 'https://maven.notenoughupdates.org/releases/' }
	maven {
		url = 'https://maven.blamejared.com'
		content {
			includeGroup 'com.blamejared.controlling'
			includeGroup 'com.blamejared.searchables'
		}
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "AzureAaron"
		url = "https://maven.azureaaron.net/releases"
		content {
			includeGroup "net.azureaaron"
		}
	}
}

configurations {
	moulconfig
	implementation.extendsFrom(moulconfig)
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"multi-key-bindings" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	include implementation("net.azureaaron:hm-api:${project.hm_api_version}")
	moulconfig "org.notenoughupdates.moulconfig:modern-26.2:4.7.2"
	implementation "net.fabricmc:fabric-language-kotlin:1.14.1+kotlin.2.4.20"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
    // Optional compile time dependency for development
    compileOnly "com.blamejared.searchables:Searchables-fabric-26.1:1.0.4@jar"
    compileOnly "com.blamejared.controlling:Controlling-fabric-26.1:26.1.0.1@jar"
}

shadowJar {
	configurations = []
	archiveClassifier = ''
	dependsOn tasks.jar
	from sourceSets.client.output
	// Loom adds nested dependencies and their descriptor entries to the thin jar.
	from({ zipTree(tasks.jar.archiveFile.get().asFile) }) {
		include 'fabric.mod.json', 'META-INF/jars/**', 'LICENSE_*', 'NOTICE'
	}
	eachFile { details ->
		if (details.path == 'fabric.mod.json'
				&& details.file == layout.buildDirectory.file('resources/main/fabric.mod.json').get().asFile) {
			details.exclude()
		}
	}
	from({ project.configurations.moulconfig.collect { zipTree(it) } }) {
		exclude 'fabric.mod.json', 'moulconfig.accesswidener', 'io/github/notenoughupdates/moulconfig/test/**'
	}
	relocate 'io.github.notenoughupdates.moulconfig', 'us.kenny.deps.moulconfig'
	mergeServiceFiles()
}
jar { archiveClassifier = 'thin' }
tasks.build.dependsOn tasks.shadowJar
tasks.test { useJUnitPlatform() }
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
tasks.compileTestJava.dependsOn tasks.clientClasses

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("NOTICE")
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifact tasks.shadowJar
			artifact tasks.sourcesJar
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

loom {
	accessWidenerPath = file("src/main/resources/multi-key-bindings.accesswidener")
}

tasks.sourcesJar { from("NOTICE") }
