plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.3.2'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = 'https://maven.notenoughupdates.org/releases/' }
    maven {
        url = 'https://maven.azureaaron.net/releases'
        content { includeGroup 'net.azureaaron' }
    }
}

configurations {
    moulconfig
    implementation.extendsFrom(moulconfig)
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file('src/main/resources/justanothersbmod.accesswidener')
    mods {
        justanothersbmod {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    include implementation("net.azureaaron:hm-api:${project.hm_api_version}")
    moulconfig 'org.notenoughupdates.moulconfig:modern-26.2:4.7.2'
    implementation 'net.fabricmc:fabric-language-kotlin:1.14.1+kotlin.2.4.20'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    archiveClassifier = 'thin'
    from('NOTICE')
    from('licenses') { into 'licenses' }
}

shadowJar {
    configurations = []
    archiveClassifier = ''
    dependsOn tasks.jar
    from sourceSets.client.output
    // Keep Loom's processed descriptor and nested Hypixel API dependency.
    from({ zipTree(tasks.jar.archiveFile.get().asFile) }) {
        include 'fabric.mod.json', 'META-INF/jars/**', 'NOTICE', 'licenses/**'
    }
    eachFile { details ->
        if (details.path == 'fabric.mod.json'
                && details.file == layout.buildDirectory.file('resources/main/fabric.mod.json').get().asFile) {
            details.exclude()
        }
    }
    from({ project.configurations.moulconfig.collect { zipTree(it) } }) {
        exclude 'fabric.mod.json', 'moulconfig.accesswidener', 'LICENSE', 'io/github/notenoughupdates/moulconfig/test/**'
    }
    relocate 'io.github.notenoughupdates.moulconfig', 'dev.norhythm.justanothersbmod.deps.moulconfig'
    mergeServiceFiles()
}

tasks.build.dependsOn tasks.shadowJar
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
tasks.compileTestJava.dependsOn tasks.clientClasses
tasks.test { useJUnitPlatform() }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.sourcesJar {
    from('NOTICE')
    from('licenses') { into 'licenses' }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.shadowJar
            artifact tasks.sourcesJar
        }
    }
}
